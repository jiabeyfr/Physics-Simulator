
<style>
  #sw { padding: 1rem 0; font-family: var(--font-sans); user-select: none; }
  #canvas { border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); display: block; width: 100%; background: #080810; cursor: crosshair; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .cg { display: flex; align-items: center; gap: 6px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 5px 10px; }
  .cg label { font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }
  .cg input[type=range] { width: 70px; }
  .cg span { font-size: 12px; font-weight: 500; min-width: 26px; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 0.5px solid var(--color-border-tertiary); cursor: pointer; background: var(--color-background-secondary); color: var(--color-text-secondary); }
  .pill.on { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
  .btn { font-size: 12px; padding: 5px 12px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; }
  .btn:hover { background: var(--color-background-secondary); }
  #panel { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); padding: 10px 14px; margin-top: 8px; display: none; }
  #panel .ptitle { font-size: 13px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 8px; }
  #panel .row { margin-top: 4px; }
  #stats { font-size: 11px; color: var(--color-text-tertiary); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
</style>

<div id="sw">
  <h2 class="sr-only">2D physics simulator with editable gravity per well and black hole</h2>
  <canvas id="canvas" height="440"></canvas>

  <div class="row" id="mode-row">
    <span class="pill on" data-mode="ball">ball</span>
    <span class="pill" data-mode="box">box</span>
    <span class="pill" data-mode="triangle">triangle</span>
    <span class="pill" data-mode="drag">drag</span>
    <span class="pill" data-mode="attractor">attractor</span>
    <span class="pill" data-mode="portal">portal</span>
    <span class="pill" data-mode="bomb">bomb</span>
    <span class="pill" data-mode="eraser">eraser</span>
  </div>

  <div class="row">
    <div class="cg">
      <label>gravity</label>
      <input type="range" min="0" max="2000" step="10" value="600" id="sl-grav">
      <span id="vl-grav">600</span>
    </div>
    <div class="cg">
      <label>bounce</label>
      <input type="range" min="0" max="100" step="1" value="70" id="sl-bounce">
      <span id="vl-bounce">0.70</span>
    </div>
    <div class="cg">
      <label>friction</label>
      <input type="range" min="80" max="100" step="1" value="98" id="sl-fric">
      <span id="vl-fric">0.98</span>
    </div>
    <div class="cg">
      <label>new attractor</label>
      <select id="sl-atype" style="font-size:12px; padding:2px 4px;">
        <option value="well">gravity well</option>
        <option value="blackhole">black hole</option>
        <option value="repulsor">repulsor</option>
      </select>
    </div>
    <button class="btn" id="btn-rain">rain</button>
    <button class="btn" id="btn-explode">big bang</button>
    <button class="btn" id="btn-clear">clear</button>
    <button class="btn" id="btn-slow">slow-mo</button>
  </div>

  <div id="panel">
    <div class="ptitle" id="panel-title">selected attractor</div>
    <div class="row">
      <div class="cg">
        <label>strength</label>
        <input type="range" min="0" max="500000" step="1000" value="70000" id="sl-pstr">
        <span id="vl-pstr">70000</span>
      </div>
      <div class="cg">
        <label>radius</label>
        <input type="range" min="20" max="300" step="5" value="80" id="sl-prad">
        <span id="vl-prad">80</span>
      </div>
      <button class="btn" id="btn-pdel" style="color:var(--color-text-danger);border-color:var(--color-border-danger);">delete</button>
      <button class="btn" id="btn-pclose">close</button>
    </div>
  </div>

  <div id="stats">
    <span id="st-obj">objects: 0/500</span>
    <span id="st-info">click an attractor to edit it</span>
  </div>
</div>

<script>
const LIMIT=500;
const C=document.getElementById('canvas');
const cx=C.getContext('2d');
function resize(){ C.width=C.offsetWidth; C.height=440; }
resize(); window.addEventListener('resize',resize);

let gravity=600,bounce=0.70,friction=0.98,mode='ball',slowmo=false;
let bodies=[],attractors=[],portals=[],particles=[];
let dragging=null,dragOff={x:0,y:0},sizing=null,preview=null;
let selected=null;
let raining=false,rainTimer=null;

const COLORS=['#7f77dd','#1d9e75','#d85a30','#d4537e','#378add','#ba7517','#e24b4a','#5dcaa5','#ef9f27','#ed93b1'];
let ci=0; function nc(){ return COLORS[ci++%COLORS.length]; }

function sl(id,fn){ document.getElementById(id).addEventListener('input',fn); }
sl('sl-grav',e=>{ gravity=+e.target.value; document.getElementById('vl-grav').textContent=gravity; });
sl('sl-bounce',e=>{ bounce=+e.target.value/100; document.getElementById('vl-bounce').textContent=bounce.toFixed(2); });
sl('sl-fric',e=>{ friction=+e.target.value/100; document.getElementById('vl-fric').textContent=friction.toFixed(2); });

sl('sl-pstr',e=>{
  if(!selected) return;
  selected.strength=+e.target.value;
  document.getElementById('vl-pstr').textContent=Math.round(selected.strength);
});
sl('sl-prad',e=>{
  if(!selected) return;
  selected.radius=+e.target.value;
  document.getElementById('vl-prad').textContent=Math.round(selected.radius);
});
document.getElementById('btn-pdel').addEventListener('click',()=>{
  if(!selected) return;
  attractors=attractors.filter(a=>a!==selected);
  selected=null; document.getElementById('panel').style.display='none';
});
document.getElementById('btn-pclose').addEventListener('click',()=>{
  selected=null; document.getElementById('panel').style.display='none';
});

document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
    p.classList.add('on'); mode=p.dataset.mode;
  });
});

function stopRain(){
  raining=false; clearInterval(rainTimer); rainTimer=null;
  document.getElementById('btn-rain').textContent='rain';
}
document.getElementById('btn-rain').addEventListener('click',()=>{
  if(raining){ stopRain(); return; }
  if(bodies.length>=LIMIT) return;
  raining=true;
  document.getElementById('btn-rain').textContent='stop rain';
  rainTimer=setInterval(()=>{
    if(bodies.length>=LIMIT){ stopRain(); return; }
    spawnBall(20+Math.random()*(C.width-40),-10,(Math.random()-.5)*150,0,6+Math.random()*12);
  },70);
});
document.getElementById('btn-explode').addEventListener('click',()=>{
  const bx=C.width/2,by=C.height/2,count=Math.min(60,LIMIT-bodies.length);
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,spd=200+Math.random()*600;
    spawnBall(bx+(Math.random()-.5)*20,by+(Math.random()-.5)*20,Math.cos(a)*spd,Math.sin(a)*spd,5+Math.random()*18);
  }
  boom(bx,by,80,'#ef9f27');
});
document.getElementById('btn-clear').addEventListener('click',()=>{ bodies=[];attractors=[];portals=[];particles=[];selected=null;document.getElementById('panel').style.display='none';stopRain(); });
document.getElementById('btn-slow').addEventListener('click',()=>{
  slowmo=!slowmo;
  document.getElementById('btn-slow').textContent=slowmo?'normal speed':'slow-mo';
});

function spawnBall(x,y,vx=0,vy=0,r=null,col=null){
  if(bodies.length>=LIMIT) return;
  r=r||(8+Math.random()*14);
  bodies.push({type:'ball',x,y,vx,vy,r,color:col||nc(),mass:r,trail:[]});
}

function boom(x,y,r,col){
  for(let i=0;i<40;i++){
    const a=Math.random()*Math.PI*2,spd=50+Math.random()*r*3;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,maxLife:0.5+Math.random()*0.4,r:2+Math.random()*4,color:col||'#ef9f27'});
  }
}

function getPos(e){
  const rect=C.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  return{x:(t.clientX-rect.left)*(C.width/rect.width),y:(t.clientY-rect.top)*(C.height/rect.height)};
}

function openPanel(attr){
  selected=attr;
  const labels={well:'gravity well',blackhole:'black hole',repulsor:'repulsor'};
  document.getElementById('panel-title').textContent='editing: '+labels[attr.kind];
  document.getElementById('sl-pstr').value=attr.strength;
  document.getElementById('vl-pstr').textContent=Math.round(attr.strength);
  document.getElementById('sl-prad').value=attr.radius;
  document.getElementById('vl-prad').textContent=Math.round(attr.radius);
  document.getElementById('panel').style.display='block';
}

C.addEventListener('mousedown',down);
C.addEventListener('touchstart',e=>{e.preventDefault();down(e);},{passive:false});
C.addEventListener('mousemove',move);
C.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});
C.addEventListener('mouseup',up);
C.addEventListener('touchend',e=>{e.preventDefault();up(e);},{passive:false});

function down(e){
  const p=getPos(e);

  if(mode==='attractor'){
    const atype=document.getElementById('sl-atype').value;
    const defaults={well:{strength:70000,radius:90},blackhole:{strength:220000,radius:60},repulsor:{strength:80000,radius:100}};
    const d=defaults[atype];
    const a={kind:atype,x:p.x,y:p.y,strength:d.strength,radius:d.radius};
    attractors.push(a);
    openPanel(a);
    return;
  }

  for(const a of attractors){
    if(Math.hypot(p.x-a.x,p.y-a.y)<18){ openPanel(a); return; }
  }

  if(mode==='drag'){
    for(let i=bodies.length-1;i>=0;i--){
      const b=bodies[i],dx=p.x-b.x,dy=p.y-b.y;
      let hit=b.type==='ball'?Math.hypot(dx,dy)<b.r:b.type==='box'?Math.abs(dx)<b.w/2&&Math.abs(dy)<b.h/2:Math.hypot(dx,dy)<b.s;
      if(hit){dragging=b;dragOff={x:dx,y:dy};b.vx=0;b.vy=0;return;}
    }
  } else if(mode==='portal'){
    const col=portals.length%2===0?'#7f77dd':'#1d9e75';
    portals.push({x:p.x,y:p.y,color:col});
  } else if(mode==='bomb'){
    boom(p.x,p.y,60,'#e24b4a');
    for(const b of bodies){
      const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy)||1;
      if(d<120){const f=(1-d/120)*1200;b.vx+=dx/d*f;b.vy+=dy/d*f;}
    }
  } else if(mode==='eraser'){
    attractors=attractors.filter(a=>Math.hypot(p.x-a.x,p.y-a.y)>24);
    bodies=bodies.filter(b=>Math.hypot(p.x-b.x,p.y-b.y)>30);
    if(selected&&!attractors.includes(selected)){selected=null;document.getElementById('panel').style.display='none';}
  } else if(['ball','box','triangle'].includes(mode)){
    const col=nc();
    sizing={startX:p.x,startY:p.y,curX:p.x,curY:p.y,color:col};
    preview={mode,startX:p.x,startY:p.y,curX:p.x,curY:p.y,color:col};
  }
}

function move(e){
  const p=getPos(e);
  if(dragging){dragging.x=p.x-dragOff.x;dragging.y=p.y-dragOff.y;}
  if(sizing){sizing.curX=p.x;sizing.curY=p.y;preview.curX=p.x;preview.curY=p.y;}
  if(mode==='eraser'&&(e.buttons||e.touches)){
    bodies=bodies.filter(b=>Math.hypot(p.x-b.x,p.y-b.y)>24);
  }
}

function up(e){
  dragging=null;
  if(sizing){
    const dx=sizing.curX-sizing.startX,dy=sizing.curY-sizing.startY,dist=Math.hypot(dx,dy);
    if(mode==='ball'){const r=Math.max(6,Math.min(100,dist));bodies.push({type:'ball',x:sizing.startX,y:sizing.startY,vx:0,vy:0,r,color:sizing.color,mass:r,trail:[]});}
    else if(mode==='box'){const w=Math.max(10,Math.abs(dx)*2),h=Math.max(10,Math.abs(dy)*2);bodies.push({type:'box',x:sizing.startX,y:sizing.startY,vx:0,vy:0,w,h,color:sizing.color,mass:w*h/100,angle:0,av:(Math.random()-.5)*1,trail:[]});}
    else if(mode==='triangle'){const s=Math.max(10,Math.min(120,dist));bodies.push({type:'tri',x:sizing.startX,y:sizing.startY,vx:0,vy:0,s,color:sizing.color,mass:s*s/200,angle:Math.random()*Math.PI*2,av:(Math.random()-.5)*2,trail:[]});}
    else ci--;
    sizing=null;preview=null;
  }
}

let last=0;
function step(ts){
  const rawDt=Math.min((ts-last)/1000,0.033);
  last=ts;
  const dt=slowmo?rawDt*0.18:rawDt;
  const W=C.width,H=C.height;

  for(const b of bodies){
    if(b===dragging) continue;
    b.vy+=gravity*dt;

    for(const a of attractors){
      const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;
      if(a.kind==='blackhole'&&d<14){
        bodies.splice(bodies.indexOf(b),1); boom(a.x,a.y,20,'#7f77dd'); break;
      }
      const d2=dx*dx+dy*dy+400;
      const sign=a.kind==='repulsor'?-1:1;
      const f=sign*a.strength/d2;
      b.vx+=f*(dx/d)*dt; b.vy+=f*(dy/d)*dt;
    }

    b.x+=b.vx*dt; b.y+=b.vy*dt;

    if(b.type==='ball'){
      if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*bounce;}
      if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)*bounce;}
      if(b.y+b.r>H){b.y=H-b.r;b.vy=-Math.abs(b.vy)*bounce;b.vx*=friction;}
      if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)*bounce;}
    } else {
      const hw=(b.type==='box'?b.w:b.s)/2,hh=(b.type==='box'?b.h:b.s)/2;
      b.angle+=b.av*dt;
      if(b.x-hw<0){b.x=hw;b.vx=Math.abs(b.vx)*bounce;b.av*=0.8;}
      if(b.x+hw>W){b.x=W-hw;b.vx=-Math.abs(b.vx)*bounce;b.av*=0.8;}
      if(b.y+hh>H){b.y=H-hh;b.vy=-Math.abs(b.vy)*bounce;b.vx*=friction;b.av*=0.9;}
      if(b.y-hh<0){b.y=hh;b.vy=Math.abs(b.vy)*bounce;}
    }

    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>18) b.trail.shift();

    for(let pi=0;pi<portals.length-1;pi+=2){
      const pa=portals[pi],pb=portals[pi+1];
      if(Math.hypot(b.x-pa.x,b.y-pa.y)<18&&!b._pcd){b.x=pb.x;b.y=pb.y;b._pcd=20;boom(pb.x,pb.y,10,pb.color);}
      if(Math.hypot(b.x-pb.x,b.y-pb.y)<18&&!b._pcd){b.x=pa.x;b.y=pa.y;b._pcd=20;boom(pa.x,pa.y,10,pa.color);}
    }
    if(b._pcd>0) b._pcd--;
  }

  for(let i=0;i<bodies.length;i++)
    for(let j=i+1;j<bodies.length;j++)
      if(bodies[i].type==='ball'&&bodies[j].type==='ball') collideBalls(bodies[i],bodies[j]);

  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=gravity*0.3*dt;p.vx*=0.96;p.vy*=0.96;p.life-=dt/p.maxLife;}
  particles=particles.filter(p=>p.life>0);

  cx.clearRect(0,0,W,H);

  for(const b of bodies){
    if(b.trail.length>1){
      cx.beginPath();cx.moveTo(b.trail[0].x,b.trail[0].y);
      for(let i=1;i<b.trail.length;i++) cx.lineTo(b.trail[i].x,b.trail[i].y);
      cx.strokeStyle=b.color+'44';cx.lineWidth=b.type==='ball'?b.r*0.6:4;cx.lineCap='round';cx.stroke();
    }
  }

  for(const a of attractors){
    const isSelected=a===selected;
    const col=a.kind==='repulsor'?'#d85a30':a.kind==='blackhole'?'#7f77dd':'#1d9e75';
    const innerR=a.kind==='blackhole'?14:6;

    const g=cx.createRadialGradient(a.x,a.y,innerR,a.x,a.y,a.radius);
    g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');
    cx.beginPath();cx.arc(a.x,a.y,a.radius,0,Math.PI*2);cx.fillStyle=g;cx.fill();

    if(a.kind==='blackhole'){
      cx.beginPath();cx.arc(a.x,a.y,innerR,0,Math.PI*2);cx.fillStyle='#0a0010';cx.fill();
    }
    cx.beginPath();cx.arc(a.x,a.y,innerR,0,Math.PI*2);
    cx.strokeStyle=col;cx.lineWidth=isSelected?3:1.5;cx.stroke();

    if(a.kind==='repulsor'){
      cx.beginPath();cx.moveTo(a.x-4,a.y);cx.lineTo(a.x+4,a.y);cx.strokeStyle=col;cx.lineWidth=2;cx.stroke();
    }

    if(isSelected){
      cx.beginPath();cx.arc(a.x,a.y,a.radius,0,Math.PI*2);
      cx.strokeStyle=col+'88';cx.lineWidth=1;cx.setLineDash([5,4]);cx.stroke();cx.setLineDash([]);
    }

    const label=a.kind==='blackhole'?'BH':a.kind==='repulsor'?'REP':'GW';
    cx.fillStyle=col;cx.font='10px var(--font-sans)';cx.textAlign='center';
    cx.fillText(label,a.x,a.y+(a.kind==='blackhole'?28:20));
    cx.textAlign='left';
  }

  for(let pi=0;pi<portals.length;pi+=2){
    drawPortal(portals[pi].x,portals[pi].y,portals[pi].color);
    if(portals[pi+1]) drawPortal(portals[pi+1].x,portals[pi+1].y,portals[pi+1].color);
  }

  for(const b of bodies){
    cx.save();
    if(b.type==='ball'){
      cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fillStyle=b.color;cx.fill();
      cx.strokeStyle=lighten(b.color);cx.lineWidth=1;cx.stroke();
      const shine=cx.createRadialGradient(b.x-b.r*0.35,b.y-b.r*0.35,b.r*0.05,b.x-b.r*0.2,b.y-b.r*0.2,b.r*0.6);
      shine.addColorStop(0,'rgba(255,255,255,0.22)');shine.addColorStop(1,'rgba(255,255,255,0)');
      cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fillStyle=shine;cx.fill();
    } else if(b.type==='box'){
      cx.translate(b.x,b.y);cx.rotate(b.angle);
      cx.fillStyle=b.color;cx.strokeStyle=lighten(b.color);cx.lineWidth=1.5;
      cx.beginPath();cx.roundRect(-b.w/2,-b.h/2,b.w,b.h,3);cx.fill();cx.stroke();
    } else {
      cx.translate(b.x,b.y);cx.rotate(b.angle);
      cx.beginPath();cx.moveTo(0,-b.s*0.6);cx.lineTo(b.s*0.5,b.s*0.4);cx.lineTo(-b.s*0.5,b.s*0.4);cx.closePath();
      cx.fillStyle=b.color;cx.fill();cx.strokeStyle=lighten(b.color);cx.lineWidth=1.5;cx.stroke();
    }
    cx.restore();
  }

  for(const p of particles){
    cx.globalAlpha=Math.max(0,p.life);
    cx.beginPath();cx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);cx.fillStyle=p.color;cx.fill();
  }
  cx.globalAlpha=1;

  if(preview){
    const dx=preview.curX-preview.startX,dy=preview.curY-preview.startY;
    cx.save();cx.globalAlpha=0.55;cx.strokeStyle=preview.color;cx.lineWidth=2;cx.setLineDash([5,4]);
    if(preview.mode==='ball'){const r=Math.max(6,Math.min(100,Math.hypot(dx,dy)));cx.beginPath();cx.arc(preview.startX,preview.startY,r,0,Math.PI*2);cx.stroke();cx.setLineDash([]);cx.globalAlpha=0.75;cx.fillStyle=preview.color;cx.font='12px var(--font-sans)';cx.fillText('r='+Math.round(r),preview.startX+6,preview.startY-8);}
    else if(preview.mode==='box'){const w=Math.max(10,Math.abs(dx)*2),h=Math.max(10,Math.abs(dy)*2);cx.beginPath();cx.roundRect(preview.startX-w/2,preview.startY-h/2,w,h,3);cx.stroke();cx.setLineDash([]);cx.globalAlpha=0.75;cx.fillStyle=preview.color;cx.font='12px var(--font-sans)';cx.fillText(Math.round(w)+'x'+Math.round(h),preview.startX+6,preview.startY-8);}
    else if(preview.mode==='triangle'){const s=Math.max(10,Math.min(120,Math.hypot(dx,dy)));cx.save();cx.translate(preview.startX,preview.startY);cx.beginPath();cx.moveTo(0,-s*0.6);cx.lineTo(s*0.5,s*0.4);cx.lineTo(-s*0.5,s*0.4);cx.closePath();cx.stroke();cx.restore();cx.setLineDash([]);cx.globalAlpha=0.75;cx.fillStyle=preview.color;cx.font='12px var(--font-sans)';cx.fillText('s='+Math.round(s),preview.startX+6,preview.startY-8);}
    cx.setLineDash([]);cx.restore();
  }

  if(bodies.length>=LIMIT&&raining) stopRain();
  document.getElementById('st-obj').textContent=`objects: ${bodies.length}/${LIMIT}`;
  requestAnimationFrame(step);
}

function drawPortal(x,y,color){
  cx.beginPath();cx.arc(x,y,18,0,Math.PI*2);cx.strokeStyle=color;cx.lineWidth=3;cx.stroke();
  const g=cx.createRadialGradient(x,y,2,x,y,18);g.addColorStop(0,color+'88');g.addColorStop(1,color+'00');cx.fillStyle=g;cx.fill();
}

function lighten(hex){
  const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.min(255,(n>>16)+55)},${Math.min(255,((n>>8)&0xff)+55)},${Math.min(255,(n&0xff)+55)})`;
}

function collideBalls(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),minD=a.r+b.r;
  if(dist>=minD||dist<0.01) return;
  const nx=dx/dist,ny=dy/dist,ov=(minD-dist)/2;
  a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
  const dvx=a.vx-b.vx,dvy=a.vy-b.vy,dot=dvx*nx+dvy*ny;
  if(dot<=0) return;
  const imp=(2*dot*bounce)/(a.mass+b.mass);
  a.vx-=imp*b.mass*nx;a.vy-=imp*b.mass*ny;
  b.vx+=imp*a.mass*nx;b.vy+=imp*a.mass*ny;
}

for(let i=0;i<14;i++) spawnBall(60+i*42,40+Math.random()*80,(Math.random()-.5)*60,0);
requestAnimationFrame(step);
